<style>
/* Layout: reference library (same system as the Wonderful Reference). Sticky left index, one reading column (~68ch), section TOC on wide screens. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --sunken: #eceff0;
  --fg: #19201c;
  --muted: #5b665f;

    --bg: #111513; --surface: #171c19; --sunken: #1d2320; --fg: #e4eae6; --muted: #9ba7a0; --faint: #6f7b74;
    --line: #29312d; --accent: #63c3a5; --accent-soft: #1b2f28;
    --ok: #6cc98f; --ok-soft: #18291f; --warn: #e3a54f; --warn-soft: #2d2213; --bad: #ec8b7f; --bad-soft: #301b18;
    --info: #93acdf; --info-soft: #1b2232; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #171c19; --sunken: #1d2320; --fg: #e4eae6; --muted: #9ba7a0; --faint: #6f7b74;
  --line: #29312d; --accent: #63c3a5; --accent-soft: #1b2f28;
  --ok: #6cc98f; --ok-soft: #18291f; --warn: #e3a54f; --warn-soft: #2d2213; --bad: #ec8b7f; --bad-soft: #301b18;

.search { position: relative; display: block; }

.page { display: grid; grid-template-columns: minmax(0, 46rem) 13rem; gap: 3rem; max-width: 64rem; }

.meta {

}
.meta-item { display: flex; align-items: center; gap: .45rem; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: .35rem; font-size: .72rem; font-weight: 600; padding: .15rem .55rem; border-radius: 999px; }
.pill.sufficient { background: var(--ok-soft); color: var(--ok); }

.conf-bar i.low { background: var(--warn); }

/* inline markers: inferred claims and proposals */
.mark-extrap, .mark-prop {
  font-family: var(--font-ui); font-size: .72em; font-weight: 600; letter-spacing: .02em; font-style: normal;

}
.mark-extrap { color: var(--info); background: var(--info-soft); }

/* ---------- caveats ---------- */
.caveats { display: flex; flex-direction: column; gap: .6rem; margin-top: 1.5rem; }

/* ---------- prose ---------- */
.prose { font-family: var(--font-read); font-size: 1.05rem; line-height: 1.7; margin-top: 2rem; max-width: 42rem; }

.prose h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.prose h3 { font-size: 1.08rem; font-weight: 600; margin: 1.75rem 0 .5rem; }
.prose h4 { font-size: .95rem; font-weight: 600; margin: 1.5rem 0 .4rem; color: var(--muted); }

.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
.table-wrap { overflow-x: auto; margin: 0 0 1.25rem; border: 1px solid var(--line); border-radius: var(--radius); }
.prose table { border-collapse: collapse; width: 100%; font-family: var(--font-ui); font-size: .85rem; line-height: 1.45; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }

.truncation-end {

  border-top: 2px dashed var(--bad); padding-top: .6rem; margin-top: 1.5rem;

.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 2.5rem); align-self: start; font-size: .8rem; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3.5rem; max-width: 42rem; }
.pager a {
  display: flex; flex-direction: column; gap: .15rem; text-decoration: none; color: var(--fg);

.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); font-size: .72rem; }

/* ---------- home / category ---------- */
.notice {
  display: flex; gap: .75rem; align-items: flex-start; margin-top: 1.5rem;
  background: var(--accent-soft); border-radius: var(--radius); padding: .9rem 1rem; font-size: .9rem;
}
.notice b { color: var(--accent); }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin: 2.75rem 0 1rem; flex-wrap: wrap; }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .75rem; }
.legend div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem 1rem; font-size: .875rem; color: var(--muted); }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .75rem; }
.cat-card {
  display: flex; flex-direction: column; gap: .5rem; text-decoration: none; color: var(--fg);

.doc-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .35rem 1.25rem; align-items: start;
  padding: 1rem 1.1rem; text-decoration: none; color: var(--fg); border-bottom: 1px solid var(--line);

.caveat-list { display: flex; flex-direction: column; gap: .6rem; }

.results mark { background: var(--warn-soft); color: var(--fg); border-radius: 2px; padding: 0 .1em; }

  .sidebar {

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";

  const DATA = JSON.parse(document.getElementById("data").textContent);
  const META = DATA.meta;
  const CATS = DATA.categories;
  const DOCS = DATA.docs;
  const PENDING = DATA.pending || [];
  const GLOBAL_CAVEATS = DATA.caveats || [];
  const SRC = DATA.source_doc;
  const DOC_BY_ID = Object.fromEntries(DOCS.map((d) => [d.id, d]));
  const CAT_BY_ID = Object.fromEntries(CATS.map((c) => [c.id, c]));
  const CAVEAT_TAGS = { evidence: "Evidência", inferred: "Inferido", oddity: "Estranheza", conflict: "Conflito", truncated: "Truncado" };

  const main = document.getElementById("main");
  const nav = document.getElementById("nav");
  const search = document.getElementById("search");
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  const menuBtn = document.getElementById("menu-btn");
  let spy = null;

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => s.toLowerCase().normalize("NFD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  const docsIn = (catId) => DOCS.filter((d) => d.cat === catId);
  const isProposal = (d) => /^proposed, not built/i.test(d.summary || "");
  const extrapCount = (d) => (d.md.match(/\(extrapolated/gi) || []).length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  /* ---------- branding ---------- */
  const tag = META.own_product ? "produto próprio" : META.generator;
  document.getElementById("brand-mark").textContent = META.product.charAt(0).toUpperCase();
  document.getElementById("brand-text").innerHTML = `${esc(META.product)}<small>Reference · ${esc(tag)}</small>`;
  document.getElementById("topbar-brand").innerHTML = `${esc(META.product)} <span>Reference</span>`;
  search.placeholder = `Buscar em ${DOCS.length} documentos`;

  /* ---------- small components ---------- */
  const pill = (status) => `<span class="pill ${esc(status)}">${esc(status)}</span>`;
  const conf = (v) =>
    `<span class="conf"><span class="conf-bar"><i class="${v < 0.85 ? "low" : ""}" style="width:${Math.round(v * 100)}%"></i></span><span class="mono">${Number(v).toFixed(2)}</span></span>`;
  const docLink = (id) => (DOC_BY_ID[id] ? `<a href="#${esc(id)}">${esc(DOC_BY_ID[id].title)}</a>` : "");
  const flagCount = (d) => {
    const n = d.caveats.filter((c) => c.kind !== "evidence").length;
    return n ? `<span class="count-flag">${plural(n, "ressalva", "ressalvas")}</span>` : "";
  };
  const propChip = (d) => (isProposal(d) ? `<span class="chip-prop">proposta</span>` : "");
  const sourceLink = () =>
    SRC ? `<a href="#fonte">${esc(META.source_label)}</a>` : `<a href="${esc(META.source)}" target="_blank" rel="noopener">${esc(META.source_label)}</a>`;

  function caveatHtml(c, opts) {
    const related = c.link && DOC_BY_ID[c.link] ? ` Ver também: ${docLink(c.link)}.` : "";
    const where = opts && opts.doc ? `<br>${docLink(opts.doc.id)}` : "";
    return `<div class="caveat ${esc(c.kind)}">
      <span class="tag">${esc(CAVEAT_TAGS[c.kind] || c.kind)}${where}</span>
      <strong>${esc(c.title)}</strong>
      <p>${esc(c.text)}${related}</p>
    </div>`;
  }

  /* ---------- navigation ---------- */
  function renderNav() {
    const groups = CATS.map((c) => {
      const items = docsIn(c.id)
        .map((d) => {
          const hasFlag = d.caveats.some((x) => x.kind === "truncated" || x.kind === "conflict");
          const right = isProposal(d) ? '<span class="tag-prop">proposta</span>' : hasFlag ? '<span class="flag" title="Truncado ou conflitante">!</span>' : "";
          return `<a class="nav-link" href="#${esc(d.id)}" data-route="${esc(d.id)}">
            <span class="dot ${esc(d.status)}" title="${esc(d.status)}"></span>${esc(d.title)}${right}
          </a>`;
        })
        .join("");
      return `<div class="nav-group">
        <a class="nav-cat" href="#cat-${esc(c.id)}" data-route="cat-${esc(c.id)}">${esc(c.label)}<span>${docsIn(c.id).length}</span></a>
        ${items}
      </div>`;
    }).join("");
    const source = SRC
      ? `<div class="nav-group"><span class="nav-label">Fonte</span>
          <a class="nav-link" href="#fonte" data-route="fonte"><span class="dot source"></span>Documento-fonte</a></div>`
      : "";
    nav.innerHTML = `<a class="nav-link nav-home" href="#home" data-route="home">Visão geral</a>${groups}${source}`;
  }

  function markCurrent(route) {
    nav.querySelectorAll("[data-route]").forEach((a) => {
      if (a.dataset.route === route) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    const active = nav.querySelector('[aria-current="page"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
  }

  /* ---------- pages ---------- */
  function knownCaveats() {
    const seen = new Set();
    const pairs = new Set();
    const out = GLOBAL_CAVEATS.map((c) => caveatHtml(c));
    DOCS.forEach((d) =>
      d.caveats.forEach((c) => {
        if (c.kind === "evidence" || seen.has(c.text)) return;
        const pair = c.kind === "conflict" && c.link ? [d.id, c.link].sort().join("|") : null;
        if (pair && pairs.has(pair)) return;
        seen.add(c.text);
        if (pair) pairs.add(pair);
        out.push(caveatHtml(c, { doc: d }));
      })
    );
    return out.join("");
  }

  function homePage() {
    const total = DOCS.length;
    const limited = DOCS.filter((d) => d.status === "limited").length;
    const proposals = DOCS.filter(isProposal).length;
    const cards = CATS.map((c) => {
      const ds = docsIn(c.id);
      const suff = ds.filter((d) => d.status === "sufficient").length;
      const prop = ds.filter(isProposal).length;
      return `<a class="cat-card" href="#cat-${esc(c.id)}">
        <h3>${esc(c.label)}</h3>
        <p>${esc(c.blurb)}</p>
        <div class="stats">
          <span class="mono">${ds.length} docs</span>
          ${suff ? `<span><i class="dot sufficient"></i>${suff} sufficient</span>` : ""}
          ${ds.length - suff ? `<span><i class="dot limited"></i>${ds.length - suff} limited</span>` : ""}
          ${prop ? `<span>${plural(prop, "proposta", "propostas")}</span>` : ""}
        </div>
      </a>`;
    }).join("");
    const notice = META.own_product
      ? `<b>Produto próprio.</b> Estes arquivos descrevem ${esc(META.product)} a partir de documentos internos. O que é proposta ou rascunho está marcado como tal: não trate como fato de mercado.`
      : `<b>Produto de referência.</b> Estes arquivos descrevem ${esc(META.product)}, não o nosso produto. Use como exemplo, benchmark ou evidência de mercado.`;
    const pending = PENDING.length
      ? `<div class="notice warn" style="margin-top:2rem"><div><b>Ainda não gerado.</b> A fonte não sustenta estas categorias:
          <ul class="pending-list">${PENDING.map((p) => `<li>${esc(p.label)} (${esc(p.docs.join(", "))})</li>`).join("")}</ul></div></div>`
      : "";
    const legacy = META.generator === "Vicaura"
      ? " Em arquivos legados da Vicaura a marcação é inconsistente: um ponto sem marca não está necessariamente verificado."
      : " Um ponto sem marca tem fonte.";

    return `<div class="page wide"><div class="page-body">
      <div class="crumbs"><span>${esc(META.root)}</span><span>/</span><span>${esc(META.slug)}</span></div>
      <h1 class="title">${esc(META.product)}</h1>
      ${META.lede ? `<p class="lede">${esc(META.lede)}</p>` : ""}
      <div class="meta">
        <span class="meta-item"><b>Fonte</b>${sourceLink()}</span>
        <span class="meta-item"><b>Gerado</b><span class="mono">${esc(META.generated)} UTC</span></span>
        <span class="meta-item"><b>Documentos</b><span class="mono">${total}</span></span>
        <span class="meta-item"><b>Limited</b><span class="mono">${limited}</span></span>
        ${proposals ? `<span class="meta-item"><b>Propostas</b><span class="mono">${proposals}</span></span>` : ""}
      </div>
      <div class="notice"><div>${notice}</div></div>

      <div class="section-head"><h2>Categorias</h2><span>${plural(CATS.length, "área", "áreas")}</span></div>
      <div class="cats">${cards}</div>

      <div class="section-head"><h2>Como ler</h2></div>
      <div class="legend">
        <div><span class="pill sufficient">sufficient</span><br>Há evidência suficiente para sustentar o arquivo.</div>
        <div><span class="pill limited">limited</span><br>Menos evidência. A confiança (0 a 1) diz quanto do arquivo está na fonte.</div>
        <div><span class="pill neutral">marcações</span><br><span class="mark-extrap">Extrapolated</span> marca uma afirmação inferida, sem fonte.${proposals ? ` <span class="mark-prop">Proposed, not built</span> marca o que é proposta.` : ""}${legacy}</div>
      </div>

      <div class="section-head"><h2>Ressalvas conhecidas</h2><span>Cada uma também aparece na página do documento</span></div>
      <div class="caveat-list">${knownCaveats() || '<p class="empty">Nenhuma ressalva registrada.</p>'}</div>
      ${pending}
      <p class="foot">Arquivos gerados por ${esc(META.generator)} em ${esc(META.generated)} (UTC). Conteúdo dos documentos em inglês${SRC ? "; documento-fonte no original" : ""}.</p>
    </div></div>`;
  }

  function categoryPage(cat) {
    const rows = docsIn(cat.id).map((d) => `<a class="doc-row" href="#${esc(d.id)}">
        <h3>${esc(d.title)} ${propChip(d)} ${flagCount(d)}</h3>
        <p>${esc(d.summary)}</p>
        <div class="row-meta">${pill(d.status)}${conf(d.confidence)}</div>
      </a>`).join("");
    const note = cat.note ? `<div class="notice warn"><div><b>Atenção.</b> ${esc(cat.note)}</div></div>` : "";
    return `<div class="page wide"><div class="page-body">
      <div class="crumbs"><a href="#home">Visão geral</a><span>/</span><span>${esc(cat.name)}</span></div>
      <h1 class="title">${esc(cat.label)}</h1>
      <p class="lede">${esc(cat.blurb)}</p>
      ${note}
      <div class="section-head"><h2>Documentos</h2><span>${plural(docsIn(cat.id).length, "arquivo", "arquivos")}</span></div>
      <div class="doc-list">${rows}</div>
    </div></div>`;
  }

  function markInline(root) {
    const re = /\(extrapolated[^)]*\)|\(proposed[^)]*not built\)|proposed, not built:?/gi;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement && n.parentElement.closest("code, pre") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const text = node.nodeValue;
      re.lastIndex = 0;
      if (!re.test(text)) return;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0;
      let m;
      while ((m = re.exec(text))) {
        frag.append(text.slice(last, m.index));
        const span = document.createElement("span");
        span.className = /^\(extrapolated/i.test(m[0]) ? "mark-extrap" : "mark-prop";
        span.textContent = m[0].replace(/^\(|\)$/g, "").replace(/:$/, "");
        frag.append(span);
        last = m.index + m[0].length;
      }
      frag.append(text.slice(last));
      node.replaceWith(frag);
    });
  }

  function renderMarkdown(md, opts) {
    const tmp = document.createElement("div");
    tmp.innerHTML = window.marked ? window.marked.parse(md) : `<pre>${esc(md)}</pre>`;
    const used = new Set();
    tmp.querySelectorAll("h2, h3").forEach((h) => {
      let id = "s-" + slug(h.textContent);
      while (used.has(id)) id += "-";
      used.add(id);
      h.id = id;
    });
    tmp.querySelectorAll("table").forEach((t) => {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      t.replaceWith(wrap);
      wrap.appendChild(t);
    });
    tmp.querySelectorAll("a[href^='http']").forEach((a) => {
      a.target = "_blank";
      a.rel = "noopener";
    });
    tmp.querySelectorAll("a[href$='.md']").forEach((a) => {
      const id = a.getAttribute("href").split("/").pop().replace(/\.md$/, "");
      if (DOC_BY_ID[id]) a.setAttribute("href", "#" + id);
    });
    if (!opts || !opts.raw) markInline(tmp);
    return tmp;
  }

  function tocHtml(body) {
    const items = [...body.querySelectorAll("h2, h3")].map(
      (h) => `<li class="${h.tagName === "H3" ? "sub" : ""}"><button type="button" data-target="${h.id}">${esc(h.textContent)}</button></li>`
    );
    return items.length > 1 ? `<nav class="toc" aria-label="Nesta página"><h2>Nesta página</h2><ol>${items.join("")}</ol></nav>` : "";
  }

  function docPage(d) {
    const cat = CAT_BY_ID[d.cat];
    const body = renderMarkdown(d.md);
    const truncated = d.caveats.some((c) => c.kind === "truncated");
    const idx = DOCS.indexOf(d);
    const prev = DOCS[idx - 1];
    const next = DOCS[idx + 1];
    const marks = extrapCount(d);
    const pagerLink = (x, cls, label) =>
      x ? `<a class="${cls}" href="#${esc(x.id)}"><small>${label} · ${esc(CAT_BY_ID[x.cat].label)}</small>${esc(x.title)}</a>` : "<span></span>";

    return `<div class="page"><div class="page-body">
      <div class="crumbs"><a href="#home">Visão geral</a><span>/</span><a href="#cat-${esc(cat.id)}">${esc(cat.label)}</a></div>
      <h1 class="title">${esc(d.title)}</h1>
      <div class="meta">
        <span class="meta-item"><b>Status</b>${pill(d.status)}${propChip(d)}</span>
        <span class="meta-item"><b>Confiança</b>${conf(d.confidence)}</span>
        ${marks ? `<span class="meta-item"><b>Inferências</b><span class="mono">${marks}</span></span>` : ""}
        <span class="meta-item"><b>Gerado</b><span class="mono">${esc(d.generated)}</span></span>
        <span class="meta-item"><b>Arquivo</b><span class="mono">${esc(d.path)}</span></span>
      </div>
      ${d.caveats.length ? `<div class="caveats">${d.caveats.map((c) => caveatHtml(c)).join("")}</div>` : ""}
      <article class="prose">${body.innerHTML}${truncated ? '<p class="truncation-end">O arquivo original termina aqui, no meio da frase.</p>' : ""}</article>
      <div class="pager">${pagerLink(prev, "prev", "Anterior")}${pagerLink(next, "next", "Próximo")}</div>
    </div>${tocHtml(body)}</div>`;
  }

  function sourcePage() {
    const body = renderMarkdown(SRC.md, { raw: true });
    return `<div class="page"><div class="page-body">
      <div class="crumbs"><a href="#home">Visão geral</a><span>/</span><span>Fonte</span></div>
      <h1 class="title">${esc(SRC.title)}</h1>
      <div class="meta">
        <span class="meta-item"><b>Tipo</b><span class="pill neutral">documento interno</span></span>
        <span class="meta-item"><b>Arquivo</b><span class="mono">${esc(SRC.path)}</span></span>
      </div>
      <div class="notice"><div><b>Documento-fonte.</b> Texto original, sem edição. Todos os documentos desta biblioteca citam este arquivo.</div></div>
      <article class="prose">${body.innerHTML}</article>
    </div>${tocHtml(body)}</div>`;
  }

  function notFound() {
    return `<div class="page wide"><div class="page-body"><h1 class="title">Página não encontrada</h1>
      <p class="lede">Este endereço não corresponde a nenhum documento. <a href="#home">Voltar à visão geral</a>.</p></div></div>`;
  }

  /* ---------- search ---------- */
  function snippet(text, q) {
    const plain = text.replace(/[#*_`>|]/g, "").replace(/\s+/g, " ");
    const i = plain.toLowerCase().indexOf(q);
    if (i < 0) return esc(plain.slice(0, 180)) + "…";
    const start = Math.max(0, i - 80);
    const raw = (start ? "…" : "") + plain.slice(start, i + q.length + 120) + "…";
    const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    return esc(raw).replace(re, (m) => `<mark>${m}</mark>`);
  }

  function searchPage(raw) {
    const q = raw.trim().toLowerCase();
    const pool = DOCS.map((d) => ({ href: d.id, title: d.title, md: d.md, label: CAT_BY_ID[d.cat].label }));
    if (SRC) pool.push({ href: "fonte", title: SRC.title, md: SRC.md, label: "Fonte" });
    const hits = pool
      .map((p) => {
        const inTitle = p.title.toLowerCase().includes(q);
        const count = p.md.toLowerCase().split(q).length - 1;
        return { p, score: (inTitle ? 100 : 0) + count, count };
      })
      .filter((h) => h.score > 0)
      .sort((a, b) => b.score - a.score);
    const rows = hits.map(({ p, count }) => `<a class="doc-row" href="#${esc(p.href)}">
        <h3>${esc(p.title)}</h3>
        <p>${snippet(p.md, q)}</p>
        <div class="row-meta"><span class="mono" style="color:var(--muted)">${esc(p.label)}</span><span class="mono">${plural(count, "ocorrência", "ocorrências")}</span></div>
      </a>`).join("");
    return `<div class="page wide"><div class="page-body results">
      <div class="crumbs"><a href="#home">Visão geral</a><span>/</span><span>Busca</span></div>
      <h1 class="title">“${esc(raw.trim())}”</h1>
      <p class="lede">${plural(hits.length, "documento", "documentos")} com este termo.</p>
      ${hits.length ? `<div class="doc-list" style="margin-top:1.5rem">${rows}</div>` : '<p class="empty">Nada encontrado. Os documentos estão em inglês: tente termos como “judge”, “Blueprint” ou “hours freed”.</p>'}
    </div></div>`;
  }

  /* ---------- router ---------- */
  function currentRoute() {
    const h = decodeURIComponent(location.hash.slice(1));
    return h || "home";
  }

  function setupTocSpy() {
    if (spy) spy.disconnect();
    const buttons = [...main.querySelectorAll(".toc button")];
    if (!buttons.length || !("IntersectionObserver" in window)) return;
    const byId = Object.fromEntries(buttons.map((b) => [b.dataset.target, b]));
    spy = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          buttons.forEach((b) => b.classList.toggle("active", b === byId[e.target.id]));
        });
      },
      { rootMargin: "0px 0px -70% 0px" }
    );
    buttons.forEach((b) => {
      const el = document.getElementById(b.dataset.target);
      if (el) spy.observe(el);
    });
  }

  function render() {
    const route = currentRoute();
    let html;
    if (route === "home") html = homePage();
    else if (route === "fonte" && SRC) html = sourcePage();
    else if (route.startsWith("cat-") && CAT_BY_ID[route.slice(4)]) html = categoryPage(CAT_BY_ID[route.slice(4)]);
    else if (DOC_BY_ID[route]) html = docPage(DOC_BY_ID[route]);
    else html = notFound();
    main.innerHTML = html;
    markCurrent(route);
    setupTocSpy();
    const doc = DOC_BY_ID[route];
    document.title = doc ? `${doc.title} · ${META.product} Reference` : `${META.product} Reference`;
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }

  /* ---------- events ---------- */
  function toggleMenu(open) {
    sidebar.classList.toggle("open", open);
    scrim.hidden = !open;
    menuBtn.setAttribute("aria-expanded", String(open));
  }

  menuBtn.addEventListener("click", () => toggleMenu(!sidebar.classList.contains("open")));
  scrim.addEventListener("click", () => toggleMenu(false));
  nav.addEventListener("click", (e) => {
    if (e.target.closest("a")) {
      toggleMenu(false);
      if (search.value) search.value = "";
      if (e.target.closest("a").getAttribute("href") === location.hash) render();
    }
  });
  main.addEventListener("click", (e) => {
    const btn = e.target.closest(".toc button");
    if (btn) {
      const el = document.getElementById(btn.dataset.target);
      if (el) el.scrollIntoView({ block: "start" });
      return;
    }
    const link = e.target.closest("a[href^='#']");
    if (link && search.value) {
      search.value = "";
      if (link.getAttribute("href") === location.hash) render();
    }
  });

  let timer = null;
  search.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const v = search.value;
      if (v.trim().length >= 2) {
        main.innerHTML = searchPage(v);
        markCurrent("");
      } else if (!v.trim()) render();
    }, 120);
  });
  search.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      search.value = "";
      render();
    }
    if (e.key === "Enter") {
      const first = main.querySelector(".results .doc-row");
      if (first) {
        search.value = "";
        toggleMenu(false);
        if (first.getAttribute("href") === location.hash) render();
        else location.hash = first.getAttribute("href");
      }
    }
  });
  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) {
      e.preventDefault();
      if (window.matchMedia("(max-width: 860px)").matches) toggleMenu(true);
      search.focus();
    }
  });
  window.addEventListener("hashchange", render);

  renderNav();
  render();
})();
</script>
